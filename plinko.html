<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 500, H = 640;

// Board geometry
const BOARD_L = 25, BOARD_R = 475;
const SLOT_W = 50, SLOTS = 9;
const PEG_R = 5.5, BALL_R = 8;
const SLOT_TOP = 562, SLOT_BOT = 628;
const PEG_Y0 = 88, PEG_DY = 52;
const PEG_ROWS = 9;

// Build peg grid: even rows = 9 pegs at slot centers, odd rows = 8 pegs between
const pegs = [];
for (let row = 0; row < PEG_ROWS; row++) {
  const even = row % 2 === 0;
  const count = even ? 9 : 8;
  const x0 = even ? BOARD_L + SLOT_W / 2 : BOARD_L + SLOT_W;
  const y = PEG_Y0 + row * PEG_DY;
  for (let i = 0; i < count; i++) pegs.push({ x: x0 + i * SLOT_W, y });
}

// Slot values and colors
const SLOT_PTS  = [500, 200, 100, 50, 10, 50, 100, 200, 500];
const SLOT_CLRS = ['#c026d3','#f59e0b','#22c55e','#3b82f6','#64748b','#3b82f6','#22c55e','#f59e0b','#c026d3'];

// State
let score = 0, bestScore = 0, ballsLeft = 10, state = 'idle';
let balls = [], particles = [], slotFlash = new Array(SLOTS).fill(0);
let dropX = W / 2;

function createBall(x) {
  return {
    x, y: 42,
    vx: (Math.random() - 0.5) * 0.5,
    vy: 2.5,
    trail: [],
    landed: false,
    slot: -1,
    pts: 0,
    floatLife: 0,
    lastPegSound: 0,
  };
}

function drop() {
  if (state !== 'playing' || ballsLeft <= 0) return;
  ballsLeft--;
  document.getElementById('balls-left').textContent = ballsLeft;
  const x = Math.max(BOARD_L + BALL_R + 2, Math.min(BOARD_R - BALL_R - 2, dropX));
  balls.push(createBall(x));
}

function updateBalls() {
  for (const b of balls) {
    if (b.landed) { b.floatLife--; continue; }

    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 14) b.trail.shift();

    b.vy = Math.min(b.vy + 0.38, 15);
    b.x += b.vx;
    b.y += b.vy;

    // Wall bounce
    if (b.x < BOARD_L + BALL_R) { b.x = BOARD_L + BALL_R; b.vx = Math.abs(b.vx) * 0.65; }
    if (b.x > BOARD_R - BALL_R) { b.x = BOARD_R - BALL_R; b.vx = -Math.abs(b.vx) * 0.65; }

    // Peg collisions
    for (const p of pegs) {
      const dx = b.x - p.x, dy = b.y - p.y;
      const d2 = dx * dx + dy * dy;
      const minD = BALL_R + PEG_R;
      if (d2 < minD * minD && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const nx = dx / d, ny = dy / d;
        const dot = b.vx * nx + b.vy * ny;
        b.vx = (b.vx - 2 * dot * nx) * 0.62 + (Math.random() - 0.5) * 1.4;
        b.vy = Math.max((b.vy - 2 * dot * ny) * 0.62, 0.8);
        b.x = p.x + nx * (minD + 0.5);
        b.y = p.y + ny * (minD + 0.5);
        spawnPegParticles(p.x, p.y);
        const now = performance.now();
        if (now - b.lastPegSound > 80) { playPegHit(); b.lastPegSound = now; }
        break;
      }
    }

    // Land in slot
    if (b.y >= SLOT_TOP) {
      const si = Math.max(0, Math.min(SLOTS - 1, Math.floor((b.x - BOARD_L) / SLOT_W)));
      b.landed = true;
      b.slot = si;
      b.pts = SLOT_PTS[si];
      playLand(si);
      b.floatLife = 115;
      slotFlash[si] = 45;
      score += b.pts;
      document.getElementById('score').textContent = score;
      if (score > bestScore) { bestScore = score; document.getElementById('best-score').textContent = bestScore; }
      spawnLandParticles(BOARD_L + si * SLOT_W + SLOT_W / 2, SLOT_TOP, SLOT_CLRS[si]);
    }
  }

  balls = balls.filter(b => !b.landed || b.floatLife > 0);
  slotFlash = slotFlash.map(v => Math.max(0, v - 1));

  if (state === 'playing' && ballsLeft <= 0 && balls.length === 0) endGame();
}

function spawnPegParticles(x, y) {
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 2.5 + 0.5;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 18, maxLife: 18, r: Math.random()*2+1, hue: 270+Math.random()*60 });
  }
}

function spawnLandParticles(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const a = -Math.PI + Math.random() * Math.PI;
    const s = Math.random() * 4.5 + 1;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2.5, life: 38, maxLife: 38, r: Math.random()*3+1.5, color });
  }
}

function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#130820');
  bg.addColorStop(1, '#06030e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Drop guide
  if (state === 'playing') {
    ctx.save();
    ctx.strokeStyle = 'rgba(192,38,211,0.28)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 7]);
    ctx.beginPath();
    ctx.moveTo(dropX, 18);
    ctx.lineTo(dropX, PEG_Y0 - 18);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ec4899';
    ctx.shadowColor = '#ec4899';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(dropX, 22);
    ctx.lineTo(dropX - 8, 7);
    ctx.lineTo(dropX + 8, 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Slots
  for (let i = 0; i < SLOTS; i++) {
    const sx = BOARD_L + i * SLOT_W;
    const sw = SLOT_W - 1;
    const sh = SLOT_BOT - SLOT_TOP;
    const fl = slotFlash[i] / 45;
    const clr = SLOT_CLRS[i];

    ctx.save();
    ctx.fillStyle = fl > 0 ? clr + 'cc' : clr + '1c';
    ctx.fillRect(sx, SLOT_TOP, sw, sh);
    ctx.strokeStyle = fl > 0 ? clr + 'ee' : clr + '55';
    ctx.lineWidth = fl > 0 ? 2 : 1;
    ctx.strokeRect(sx, SLOT_TOP, sw, sh);

    const big = SLOT_PTS[i] >= 1000;
    ctx.font = `${big ? 7 : 8}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = fl > 0 ? '#fff' : clr;
    ctx.shadowColor = clr;
    ctx.shadowBlur = fl > 0 ? 16 : 0;
    const lbl = big ? (SLOT_PTS[i] / 1000) + 'K' : String(SLOT_PTS[i]);
    ctx.fillText(lbl, sx + SLOT_W / 2, SLOT_TOP + sh / 2 + 5);
    ctx.restore();
  }

  // Slot dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= SLOTS; i++) {
    const x = BOARD_L + i * SLOT_W;
    ctx.beginPath(); ctx.moveTo(x, SLOT_TOP); ctx.lineTo(x, SLOT_BOT); ctx.stroke();
  }

  // Pegs
  for (const p of pegs) {
    const g = ctx.createRadialGradient(p.x - 1.5, p.y - 1.5, 0.5, p.x, p.y, PEG_R);
    g.addColorStop(0, '#ddd6fe');
    g.addColorStop(1, '#7c3aed');
    ctx.save();
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 10;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PEG_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color || `hsl(${p.hue},75%,65%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Trails
  for (const b of balls) {
    if (b.landed) continue;
    for (let i = 0; i < b.trail.length; i++) {
      const a = (i / b.trail.length) * 0.35;
      const r = BALL_R * (i / b.trail.length) * 0.6;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.arc(b.trail[i].x, b.trail[i].y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Balls in flight
  for (const b of balls) {
    if (b.landed) continue;
    const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, BALL_R);
    g.addColorStop(0, '#fdf2f8');
    g.addColorStop(0.5, '#f472b6');
    g.addColorStop(1, '#be185d');
    ctx.save();
    ctx.shadowColor = '#ec4899';
    ctx.shadowBlur = 16;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Floating score text
  for (const b of balls) {
    if (!b.landed || b.floatLife <= 0) continue;
    const a = Math.min(1, b.floatLife / 25);
    const dy = (115 - b.floatLife) * 0.38;
    const cx = BOARD_L + b.slot * SLOT_W + SLOT_W / 2;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = "11px 'Press Start 2P', monospace";
    ctx.fillStyle = SLOT_CLRS[b.slot];
    ctx.shadowColor = SLOT_CLRS[b.slot];
    ctx.shadowBlur = 16;
    const lbl = b.pts >= 1000 ? '+' + (b.pts / 1000) + 'K' : '+' + b.pts;
    ctx.fillText(lbl, cx, SLOT_TOP - 14 - dy);
    ctx.restore();
  }
}

function endGame() {
  state = 'gameover';
  playEndSound(score >= 1500);
  document.getElementById('ov-emoji').textContent = score >= 1500 ? '🏆' : score >= 800 ? '🎉' : '🎯';
  document.getElementById('ov-title').textContent = score >= 1500 ? 'Jackpot!!' : 'Round Over!';
  document.getElementById('ov-sub').textContent = `You scored ${score.toLocaleString()} points!`;
  saveToLeaderboard('plinko', score);
  document.getElementById('ov-prompt').textContent = '';
  document.getElementById('ov-buttons').style.display = 'flex';
  document.getElementById('overlay').classList.remove('hidden');
}

function resetGame() {
  score = 0; ballsLeft = 10;
  balls = []; particles = []; slotFlash.fill(0);
  document.getElementById('score').textContent = 0;
  document.getElementById('balls-left').textContent = 10;
  document.getElementById('ov-buttons').style.display = 'none';
  state = 'playing';
  document.getElementById('overlay').classList.add('hidden');
}

function loop() {
  if (state === 'playing') { updateBalls(); updateParticles(); }
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', e => {
  if (state !== 'playing') return;
  const r = canvas.getBoundingClientRect();
  dropX = Math.max(BOARD_L + BALL_R + 2, Math.min(BOARD_R - BALL_R - 2, (e.clientX - r.left) * (W / r.width)));
});

canvas.addEventListener('click', () => {
  if (state === 'idle') { resetGame(); return; }
  if (state === 'playing') drop();
});

document.addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault();
    if (state === 'idle') { resetGame(); return; }
    if (state === 'playing') drop();
  }
});

loop();

let _actx = null;
function getACtx() {
  if (!_actx || _actx.state === 'closed') _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}

function playPegHit() {
  try {
    const actx = getACtx();
    const t = actx.currentTime;
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.connect(g); g.connect(actx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(900, t);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.03);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc.start(t); osc.stop(t + 0.06);
  } catch(e) {}
}

function playLand(si) {
  try {
    const actx = getACtx();
    const t = actx.currentTime;
    const basePitch = [196, 247, 294, 370, 523, 370, 294, 247, 196][si];
    const big = SLOT_PTS[si] >= 1000;
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.connect(g); g.connect(actx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(basePitch * 2, t);
    osc.frequency.exponentialRampToValueAtTime(basePitch, t + 0.1);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
    osc.start(t); osc.stop(t + 0.26);
    if (big) {
      [basePitch * 1.5, basePitch * 2, basePitch * 2.5].forEach((f, i) => {
        const o2 = actx.createOscillator(), g2 = actx.createGain();
        o2.connect(g2); g2.connect(actx.destination);
        o2.type = 'square';
        o2.frequency.setValueAtTime(f, t + i * 0.07);
        g2.gain.setValueAtTime(0.08, t + i * 0.07);
        g2.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.1);
        o2.start(t + i * 0.07); o2.stop(t + i * 0.07 + 0.12);
      });
    }
  } catch(e) {}
}

function playEndSound(jackpot) {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const freqs = jackpot ? [523, 659, 784, 1047] : [523, 587, 659];
    freqs.forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.09);
      g.gain.setValueAtTime(0.12, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.13);
      osc.start(t + i * 0.09); osc.stop(t + i * 0.09 + 0.15);
    });
  } catch(e) {}
}

function playAgainSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctx.currentTime;
  [523, 659, 784].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t + i * 0.07);
    gain.gain.setValueAtTime(0.13, t + i * 0.07);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.1);
    osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.12);
  });
}
function playExitSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    [660, 330].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.12);
      g.gain.setValueAtTime(0.0, t + i * 0.12);
      g.gain.linearRampToValueAtTime(0.1, t + i * 0.12 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.14);
      osc.start(t + i * 0.12);
      osc.stop(t + i * 0.12 + 0.16);
    });
  } catch(e) {}
}


</script>

function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-toggle').innerHTML = isLight ? MOON_SVG : '☼';
}
if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light-mode');
}

function saveToLeaderboard(game, score) {

    if (!user) return;
