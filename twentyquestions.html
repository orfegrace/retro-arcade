<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❓ 20 Questions</title>
<link rel="stylesheet" href="theme.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: var(--text);
    padding: 32px 20px 60px;
    gap: 20px;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    pointer-events: none;
    z-index: 9999;
  }
  h1 {
    font-family: var(--font-pixel);
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--pink-light), var(--lavender));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 8px rgba(220, 100, 160, 0.35));
    text-align: center;
  }
  .subtitle { font-family: var(--font-pixel); color: var(--text-muted); font-size: 0.42rem; letter-spacing: 1px; text-align: center; line-height: 1.8; }

  .card {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 4px;
    padding: 22px 26px;
    width: 100%;
    max-width: 540px;
  }

  .q-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .q-num { font-family: var(--font-pixel); font-size: 1.5rem; color: var(--pink); line-height: 1; min-width: 32px; }
  .q-label { font-family: var(--font-pixel); font-size: 0.38rem; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; }
  .q-track { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
  .q-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
  .q-dot.used   { background: var(--pink); }
  .q-dot.last3  { background: #c06060; }

  #answer-area { min-height: 54px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .answer-bubble {
    font-family: var(--font-pixel);
    padding: 10px 18px;
    border-radius: 2px;
    font-size: 0.52rem;
    letter-spacing: 0.5px;
    animation: pop-in 0.25s cubic-bezier(.34,1.56,.64,1);
    line-height: 1.8;
  }
  @keyframes pop-in { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
  .answer-yes      { background: rgba(136,192,176,0.2); color: var(--mint); border: 2px solid rgba(136,192,176,0.35); }
  .answer-no       { background: rgba(200,100,100,0.2); color: #d09090;     border: 2px solid rgba(200,100,100,0.35); }
  .answer-sometimes{ background: rgba(216,192,112,0.2); color: var(--gold); border: 2px solid rgba(216,192,112,0.35); }

  .q-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 16px; }
  .q-btn {
    background: rgba(192,160,224,0.07);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--lavender);
    font-family: var(--font-pixel);
    font-size: 0.38rem;
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.8;
  }
  .q-btn:hover:not(:disabled) { background: rgba(192,160,224,0.18); border-color: var(--border-bright); transform: translateY(-1px); }
  .q-btn:disabled { opacity: 0.35; cursor: default; text-decoration: line-through; }

  .guess-row { display: flex; gap: 8px; margin-top: 4px; }
  .guess-input {
    flex: 1;
    background: rgba(192,160,224,0.07);
    border: 2px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-family: var(--font-pixel);
    font-size: 0.5rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .guess-input:focus { border-color: var(--border-bright); }
  .guess-input::placeholder { color: var(--text-dim); }
  .guess-btn {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: var(--bg);
    font-family: var(--font-pixel);
    font-size: 0.45rem;
    border: 2px solid var(--pink-light);
    border-radius: 2px;
    padding: 10px 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: var(--glow-pink);
    letter-spacing: 0.5px;
  }
  .guess-btn:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(220,100,160,0.5); }

  #result-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(14,9,18,0.94);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; backdrop-filter: blur(10px); z-index: 10; padding: 20px; text-align: center;
  }
  #result-overlay.show { display: flex; }
  .res-emoji { font-size: 4rem; animation: wobble 2s ease infinite alternate; }
  @keyframes wobble { from{transform:rotate(-7deg)scale(1)} to{transform:rotate(7deg)scale(1.1)} }
  .res-title {
    font-family: var(--font-pixel);
    font-size: 1rem;
    background: linear-gradient(135deg, var(--pink-light), var(--lavender));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .res-word { font-family: var(--font-pixel); font-size: 1.3rem; color: var(--gold); }
  .res-sub { font-family: var(--font-pixel); color: var(--text-muted); font-size: 0.42rem; max-width: 320px; line-height: 1.8; }
  .res-buttons { display: flex; gap: 10px; margin-top: 6px; }
  .res-btn {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: var(--bg);
    font-family: var(--font-pixel);
    font-size: 0.5rem;
    border: 2px solid var(--pink-light);
    border-radius: 2px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: var(--glow-pink);
    transition: transform 0.2s;
    text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
    letter-spacing: 1px;
  }
  .res-btn:hover { transform: translateY(-2px); }
  .res-btn.secondary { background: rgba(192,160,224,0.08); color: var(--text); border: 2px solid var(--border-bright); box-shadow: none; }
</style>
</head>
<body>

<h1>❓ 20 Questions</h1>
<p class="subtitle">I'm thinking of something — ask me yes or no questions!</p>

<div class="card">
  <div class="q-bar">
    <div>
      <div class="q-num" id="q-left">20</div>
      <div class="q-label">questions left</div>
    </div>
    <div class="q-track" id="q-track"></div>
  </div>

  <div id="answer-area">
    <div class="answer-bubble answer-sometimes">Ask me anything ✨</div>
  </div>

  <div class="q-grid" id="q-grid"></div>

  <div class="guess-row">
    <input class="guess-input" id="guess-input" type="text" placeholder="Type your guess…" maxlength="40">
    <button class="guess-btn" onclick="submitGuess()">Guess!</button>
  </div>
</div>

<div id="result-overlay">
  <div class="res-emoji" id="res-emoji">🎉</div>
  <div class="res-title" id="res-title">You got it!</div>
  <div class="res-word"  id="res-word"></div>
  <div class="res-sub"   id="res-sub"></div>
  <div class="res-buttons">
    <button class="res-btn" onclick="newGame()">Play Again</button>
    <a href="index.html" class="res-btn secondary" onclick="event.preventDefault();playExitSound();setTimeout(()=>location.href='index.html',350);">Exit</a>
  </div>
</div>

<script>
const ITEMS = [
  { name:'Cat',        emoji:'🐱', a:1,pet:1,big:0,fur:1,fly:0,swim:0,legs:1,wild:0,ocean:0,scary:0,food:0,fast:0,claws:1,loud:0 },
  { name:'Dog',        emoji:'🐶', a:1,pet:1,big:0,fur:1,fly:0,swim:1,legs:1,wild:0,ocean:0,scary:0,food:0,fast:1,claws:0,loud:1 },
  { name:'Elephant',   emoji:'🐘', a:1,pet:0,big:1,fur:0,fly:0,swim:1,legs:1,wild:1,ocean:0,scary:0,food:0,fast:0,claws:0,loud:1 },
  { name:'Eagle',      emoji:'🦅', a:1,pet:0,big:0,fur:0,fly:1,swim:0,legs:1,wild:1,ocean:0,scary:0,food:0,fast:1,claws:1,loud:0 },
  { name:'Shark',      emoji:'🦈', a:1,pet:0,big:1,fur:0,fly:0,swim:1,legs:0,wild:1,ocean:1,scary:1,food:0,fast:1,claws:0,loud:0 },
  { name:'Butterfly',  emoji:'🦋', a:1,pet:0,big:0,fur:0,fly:1,swim:0,legs:1,wild:1,ocean:0,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Horse',      emoji:'🐴', a:1,pet:1,big:1,fur:1,fly:0,swim:0,legs:1,wild:0,ocean:0,scary:0,food:0,fast:1,claws:0,loud:1 },
  { name:'Penguin',    emoji:'🐧', a:1,pet:0,big:0,fur:0,fly:0,swim:1,legs:1,wild:1,ocean:1,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Lion',       emoji:'🦁', a:1,pet:0,big:1,fur:1,fly:0,swim:0,legs:1,wild:1,ocean:0,scary:1,food:0,fast:1,claws:1,loud:1 },
  { name:'Frog',       emoji:'🐸', a:1,pet:1,big:0,fur:0,fly:0,swim:1,legs:1,wild:1,ocean:0,scary:0,food:0,fast:0,claws:0,loud:1 },
  { name:'Pizza',      emoji:'🍕', a:0,pet:0,big:0,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:1,fast:0,claws:0,loud:0 },
  { name:'Strawberry', emoji:'🍓', a:0,pet:0,big:0,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:1,fast:0,claws:0,loud:0 },
  { name:'Ice Cream',  emoji:'🍦', a:0,pet:0,big:0,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:1,fast:0,claws:0,loud:0 },
  { name:'Rainbow',    emoji:'🌈', a:0,pet:0,big:1,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Guitar',     emoji:'🎸', a:0,pet:0,big:0,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:0,fast:0,claws:0,loud:1 },
  { name:'Rocket',     emoji:'🚀', a:0,pet:0,big:1,fur:0,fly:1,swim:0,legs:0,wild:0,ocean:0,scary:0,food:0,fast:1,claws:0,loud:1 },
  { name:'Diamond',    emoji:'💎', a:0,pet:0,big:0,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Dragon',     emoji:'🐉', a:1,pet:0,big:1,fur:0,fly:1,swim:0,legs:1,wild:1,ocean:0,scary:1,food:0,fast:1,claws:1,loud:1 },
  { name:'Octopus',    emoji:'🐙', a:1,pet:0,big:0,fur:0,fly:0,swim:1,legs:0,wild:1,ocean:1,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Book',       emoji:'📚', a:0,pet:0,big:0,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Moon',       emoji:'🌙', a:0,pet:0,big:1,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Cactus',     emoji:'🌵', a:0,pet:0,big:0,fur:0,fly:0,swim:0,legs:0,wild:1,ocean:0,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Unicorn',    emoji:'🦄', a:1,pet:0,big:1,fur:1,fly:0,swim:0,legs:1,wild:1,ocean:0,scary:0,food:0,fast:1,claws:0,loud:0 },
  { name:'Submarine',  emoji:'🤿', a:0,pet:0,big:1,fur:0,fly:0,swim:1,legs:0,wild:0,ocean:1,scary:0,food:0,fast:0,claws:0,loud:0 },
  { name:'Volcano',    emoji:'🌋', a:0,pet:0,big:1,fur:0,fly:0,swim:0,legs:0,wild:0,ocean:0,scary:1,food:0,fast:0,claws:0,loud:1 },
];

const QUESTIONS = [
  { text:'🐾 Is it an animal?',          key:'a' },
  { text:'🏠 Is it a pet?',              key:'pet' },
  { text:'🐘 Is it big or huge?',        key:'big' },
  { text:'🦔 Does it have fur?',         key:'fur' },
  { text:'🦅 Can it fly?',               key:'fly' },
  { text:'🏊 Can it swim?',              key:'swim' },
  { text:'🦵 Does it have legs?',        key:'legs' },
  { text:'🌿 Is it found in the wild?',  key:'wild' },
  { text:'🌊 Does it live in the ocean?',key:'ocean' },
  { text:'😱 Is it scary?',              key:'scary' },
  { text:'🍽️ Is it a food?',            key:'food' },
  { text:'💨 Is it fast?',               key:'fast' },
  { text:'🌟 Does it have claws?',       key:'claws' },
  { text:'📢 Does it make noise?',       key:'loud' },
];

let target, qLeft, askedKeys, done;

function newGame() {
  document.getElementById('result-overlay').classList.remove('show');
  target = ITEMS[Math.floor(Math.random() * ITEMS.length)];
  qLeft = 20;
  askedKeys = new Set();
  done = false;

  document.getElementById('q-left').textContent = qLeft;
  document.getElementById('guess-input').value = '';
  document.getElementById('answer-area').innerHTML =
    '<div class="answer-bubble answer-sometimes">Ask me anything ✨</div>';

  buildTrack();
  buildGrid();
}

function buildTrack() {
  const el = document.getElementById('q-track');
  el.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const d = document.createElement('div');
    d.className = 'q-dot';
    d.id = `dot-${i}`;
    el.appendChild(d);
  }
}

function buildGrid() {
  const el = document.getElementById('q-grid');
  el.innerHTML = '';
  QUESTIONS.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.textContent = q.text;
    btn.id = `qbtn-${q.key}`;
    btn.onclick = () => ask(q.key, btn);
    el.appendChild(btn);
  });
}

function ask(key, btn) {
  if (done || qLeft === 0 || askedKeys.has(key)) return;
  askedKeys.add(key);
  btn.disabled = true;

  const val = target[key];
  let text, cls;
  if (val === 1)      { text = '✅ Yes!';      cls = 'answer-yes'; }
  else if (val === 0) { text = '❌ No.';        cls = 'answer-no'; }
  else                { text = '🤔 Sometimes.'; cls = 'answer-sometimes'; }

  document.getElementById('answer-area').innerHTML =
    `<div class="answer-bubble ${cls}">${text}</div>`;

  const usedIdx = 20 - qLeft;
  const dot = document.getElementById(`dot-${usedIdx}`);
  if (dot) dot.classList.add('used');

  qLeft--;
  document.getElementById('q-left').textContent = qLeft;

  for (let i = 17; i < 20; i++) {
    const d = document.getElementById(`dot-${i}`);
    if (d && d.classList.contains('used')) d.classList.add('last3');
  }

  if (qLeft === 0 && !done) {
    setTimeout(() => outOfQuestions(), 800);
  }
}

function submitGuess() {
  if (done) return;
  const guess = document.getElementById('guess-input').value.trim().toLowerCase();
  if (!guess) return;
  done = true;

  const correct = guess === target.name.toLowerCase()
    || target.name.toLowerCase().startsWith(guess)
    || guess.startsWith(target.name.toLowerCase().split(' ')[0]);

  showResult(correct, correct
    ? `You got it in ${20 - qLeft} question${20-qLeft===1?'':'s'}!`
    : 'Better luck next time!');
}

function outOfQuestions() {
  if (done) return;
  done = true;
  showResult(false, 'You ran out of questions!');
}

function showResult(won, sub) {
  won ? playWinSound() : playLoseSound();
  document.getElementById('res-emoji').textContent = won ? '🎉' : '😢';
  document.getElementById('res-title').textContent = won ? 'You guessed it!' : 'Not quite…';
  document.getElementById('res-word').textContent  = `${target.emoji} ${target.name}`;
  document.getElementById('res-sub').textContent   = sub;
  document.getElementById('result-overlay').classList.add('show');
}

document.getElementById('guess-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitGuess();
});

newGame();

function playWinSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.08);
      g.gain.setValueAtTime(0.12, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.12);
      osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.14);
    });
  } catch(e) {}
}

function playLoseSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [392, 311, 196].forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.13);
      g.gain.setValueAtTime(0.12, t + i * 0.13);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.13 + 0.16);
      osc.start(t + i * 0.13); osc.stop(t + i * 0.13 + 0.18);
    });
  } catch(e) {}
}

function playExitSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    [660, 330].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.12);
      g.gain.setValueAtTime(0.0, t + i * 0.12);
      g.gain.linearRampToValueAtTime(0.2, t + i * 0.12 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.14);
      osc.start(t + i * 0.12);
      osc.stop(t + i * 0.12 + 0.16);
    });
  } catch(e) {}
}
</script>

<a href="index.html?from=game" style="position:fixed;top:14px;left:14px;z-index:200;background:rgba(24,16,42,0.85);color:#c090b0;font-family:'Press Start 2P',monospace;font-size:0.42rem;border:1.5px solid #5a2855;border-radius:2px;padding:7px 14px;text-decoration:none;backdrop-filter:blur(8px);letter-spacing:1px;display:inline-flex;align-items:center;line-height:1;" onclick="event.preventDefault();playExitSound();setTimeout(()=>location.href='index.html?from=game',350);">← Arcade</a>
</body>
</html>
