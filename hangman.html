<title>😵 Hangman </title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: #0e0912;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  h1 {
    font-family: var(--font-pixel);
    font-size: 1.1rem;
    line-height: 1.6;
    background: linear-gradient(135deg, var(--pink-light), var(--lavender));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 8px rgba(220, 100, 160, 0.35));
    animation: bounce-in 0.6s cubic-bezier(.36,.07,.19,.97);
  }

  @keyframes bounce-in {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    60% { transform: scale(1.1) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .subtitle {
    font-family: var(--font-pixel);
    color: var(--text-muted);
    font-size: 0.42rem;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
  }

  .game-container {
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 4px;
    padding: 28px 32px;
    box-shadow: var(--glow-pink), 0 20px 50px rgba(0,0,0,0.5);
    max-width: 700px;
    width: 100%;
    position: relative;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  /* ── SVG Gallows + Character ── */
  .gallows-area {
    position: relative;
    width: 200px;
    flex-shrink: 0;
  }

  #gallows-svg {
    width: 200px;
    height: 230px;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.08));
  }

  .gallows-line {
    stroke: #7c5cbf;
    stroke-width: 5;
    stroke-linecap: round;
    fill: none;
  }

  .body-part {
    stroke: #f472b6;
    stroke-width: 4;
    stroke-linecap: square;
    stroke-linejoin: miter;
    fill: none;
    opacity: 0;
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    transition: stroke-dashoffset 0.5s ease, opacity 0.1s;
  }

  .body-part.shown {
    opacity: 1;
    stroke-dashoffset: 0;
  }

  /* cute face */
  #face {
    fill: none;
    stroke: #f472b6;
    stroke-width: 4;
  }
  #eye-left, #eye-right {
    fill: #f472b6;
    r: 3;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #eye-left.shown, #eye-right.shown { opacity: 1; }

  #eye-left-x, #eye-right-x {
    stroke: #ef4444;
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #eye-left-x.shown, #eye-right-x.shown { opacity: 1; }

  #mouth {
    fill: none;
    stroke: #f472b6;
    stroke-width: 3;
    stroke-linecap: square;
    stroke-linejoin: miter;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #mouth.shown { opacity: 1; }

  .blush {
    opacity: 0;
    transition: opacity 0.3s;
  }
  .blush.shown { opacity: 1; }

  /* stars on win */
  .star-burst {
    position: absolute;
    font-size: 1.4rem;
    opacity: 0;
    pointer-events: none;
    animation: none;
  }
  @keyframes star-fly {
    0% { transform: translate(0,0) scale(0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(360deg); opacity: 0; }
  }

  /* ── Right Panel ── */
  .right-panel {
    flex: 1;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .hint-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card-2);
    color: var(--lavender);
    font-family: var(--font-pixel);
    font-size: 0.42rem;
    padding: 6px 12px;
    border-radius: 2px;
    border: 1.5px solid var(--border);
    letter-spacing: 1px;
    width: fit-content;
  }

  .word-display {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    min-height: 60px;
    align-items: flex-end;
  }

  .letter-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .letter-char {
    font-family: var(--font-pixel);
    font-size: 1.2rem;
    color: var(--pink-light);
    min-width: 28px;
    text-align: center;
    min-height: 36px;
    line-height: 36px;
    transform: scale(0);
    transition: transform 0.3s cubic-bezier(.36,.07,.19,.97);
    filter: drop-shadow(0 0 6px rgba(220,100,160,0.5));
  }

  .letter-char.revealed {
    transform: scale(1);
    animation: pop 0.3s cubic-bezier(.36,.07,.19,.97);
  }

  @keyframes pop {
    0% { transform: scale(0) rotate(-15deg); }
    60% { transform: scale(1.3) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .letter-underline {
    width: 28px;
    height: 4px;
    background: linear-gradient(90deg, var(--lavender), var(--pink));
    border-radius: 1px;
  }

  .wrong-letters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 28px;
  }

  .wrong-chip {
    background: rgba(200,100,100,0.15);
    color: #d09090;
    font-family: var(--font-pixel);
    font-size: 0.52rem;
    width: 28px;
    height: 28px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: shake-in 0.4s cubic-bezier(.36,.07,.19,.97);
    border: 1.5px solid rgba(200,100,100,0.35);
  }

  @keyframes shake-in {
    0% { transform: scale(0) rotate(-20deg); }
    50% { transform: scale(1.2) rotate(10deg); }
    75% { transform: scale(0.9) rotate(-5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .lives-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-pixel);
    font-size: 0.42rem;
    color: var(--text-muted);
  }

  .hearts {
    display: flex;
    gap: 4px;
  }

  .heart {
    font-size: 1.1rem;
    transition: all 0.3s;
  }
  .heart.lost {
    filter: grayscale(1) opacity(0.35);
    transform: scale(0.8);
  }

  /* ── Keyboard ── */
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    margin-top: 20px;
  }

  .key-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .key {
    width: 38px;
    height: 38px;
    border-radius: 2px;
    border: 1.5px solid var(--border);
    background: var(--bg-card-2);
    color: var(--lavender);
    font-family: var(--font-pixel);
    font-size: 0.48rem;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 3px 0 rgba(90,40,85,0.6);
    position: relative;
    top: 0;
  }

  .key:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: var(--bg);
    border-color: var(--pink-light);
    box-shadow: var(--glow-pink);
    transform: translateY(-1px);
  }

  .key:active:not(:disabled) {
    top: 3px;
    box-shadow: none;
    transform: translateY(0);
  }

  .key:disabled { cursor: not-allowed; }

  .key.correct {
    background: rgba(136,192,176,0.2);
    color: var(--mint);
    border-color: var(--mint);
    box-shadow: 0 0 10px rgba(136,192,176,0.3);
  }

  .key.wrong {
    background: rgba(200,100,100,0.1);
    color: rgba(200,100,100,0.5);
    border-color: rgba(200,100,100,0.25);
    box-shadow: none;
    opacity: 0.5;
  }

  /* ── Message overlay ── */
  .message-overlay {
    position: absolute;
    inset: 0;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 10;
  }

  .message-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .message-overlay.win  { background: rgba(14,9,18,0.94); }
  .message-overlay.lose { background: rgba(14,9,18,0.94); }

  .message-emoji {
    font-size: 4rem;
    animation: wobble 0.8s ease infinite alternate;
  }

  @keyframes wobble {
    from { transform: rotate(-8deg) scale(1); }
    to { transform: rotate(8deg) scale(1.1); }
  }

  .message-title {
    font-family: var(--font-pixel);
    font-size: 1rem;
    background: linear-gradient(135deg, var(--pink-light), var(--lavender));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .message-word {
    font-family: var(--font-pixel);
    font-size: 0.52rem;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .play-again-btn {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: var(--bg);
    border: 2px solid var(--pink-light);
    border-radius: 2px;
    padding: 12px 28px;
    font-family: var(--font-pixel);
    font-size: 0.52rem;
    cursor: pointer;
    box-shadow: var(--glow-pink);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }
  .play-again-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 55%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: skewX(-15deg);
    pointer-events: none;
    z-index: 1;
  }
  .play-again-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 36px rgba(220,100,160,0.6);
  }
  .play-again-btn:hover::before { animation: shimmer-sweep 0.5s ease forwards; }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    pointer-events: none;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
  }

  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* wrong-shake animation on the whole gallows */
  @keyframes wrong-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-2deg); }
    40% { transform: translateX(6px) rotate(2deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .shake { animation: wrong-shake 0.4s ease; }

  /* correct pulse on word display */
  @keyframes correct-glow {
    0% { box-shadow: 0 0 0 0 rgba(167,139,250,0); }
    50% { box-shadow: 0 0 20px 8px rgba(167,139,250,0.3); }
    100% { box-shadow: 0 0 0 0 rgba(167,139,250,0); }
  }

  .correct-glow { animation: correct-glow 0.5s ease; }
</style>

const BODY_PARTS = ['bp-head','bp-body','bp-larm','bp-rarm','bp-lleg','bp-rleg'];
const MAX_WRONG = 6;
const ROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];

let currentWord = '';
let category = '';
let guessed = new Set();
let wrongCount = 0;
let gameOver = false;

function loadUsed() {
  try { return new Set(JSON.parse(localStorage.getItem('hm_used') || '[]')); }
  catch { return new Set(); }
}
function saveUsed(set) {
  localStorage.setItem('hm_used', JSON.stringify([...set]));
}

function newGame() {
  let usedWords = loadUsed();
  if (usedWords.size >= WORDS.length) { usedWords = new Set(); saveUsed(usedWords); }
  const available = WORDS.filter(w => !usedWords.has(w.word));
  const pick = available[Math.floor(Math.random() * available.length)];
  usedWords.add(pick.word);
  saveUsed(usedWords);
  currentWord = pick.word;
  category = pick.category;
  guessed = new Set();
  wrongCount = 0;
  gameOver = false;

  // reset overlay
  const overlay = document.getElementById('msg-overlay');
  overlay.className = 'message-overlay';

  // reset body parts
  BODY_PARTS.forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('shown');
  });
  // hide X eyes
  document.querySelectorAll('#eye-left-x2, #eye-right-x2').forEach(e => {
    e.classList.remove('shown');
    e.style.strokeDashoffset = e.getAttribute('stroke-dasharray');
  });
  // reset face
  document.getElementById('eye-left').classList.remove('shown');
  document.getElementById('eye-right').classList.remove('shown');
  document.getElementById('mouth').classList.remove('shown');
  document.getElementById('mouth').setAttribute('d','M122,66 H123 V71 H137 V66 H138');
  document.getElementById('blush-l').classList.remove('shown');
  document.getElementById('blush-r').classList.remove('shown');

  document.getElementById('hint-badge').textContent = 'Category: ' + category.replace(/^\S+\s+/, '');
  renderHearts();
  renderWord();
  renderWrong();
  renderKeyboard();
}

function renderHearts() {
  const el = document.getElementById('hearts-display');
  el.innerHTML = '';
  for (let i = 0; i < MAX_WRONG; i++) {
    const h = document.createElement('span');
    h.className = 'heart' + (i < wrongCount ? ' lost' : '');
    h.textContent = '❤️';
    el.appendChild(h);
  }
  const left = MAX_WRONG - wrongCount;
  document.getElementById('lives-text').textContent = left + ' life' + (left === 1 ? '' : 'ies') + ' left';
}

function renderWord() {
  const el = document.getElementById('word-display');
  el.innerHTML = '';
  for (const ch of currentWord) {
    const slot = document.createElement('div');
    slot.className = 'letter-slot';

    const char = document.createElement('div');
    char.className = 'letter-char' + (guessed.has(ch) ? ' revealed' : '');
    char.id = 'slot-' + ch + '-' + [...currentWord].indexOf(ch); // approximate
    char.textContent = guessed.has(ch) ? ch : '';

    const line = document.createElement('div');
    line.className = 'letter-underline';

    slot.appendChild(char);
    slot.appendChild(line);
    el.appendChild(slot);
  }
}

function renderWrong() {
  const el = document.getElementById('wrong-letters');
  el.innerHTML = '';
  for (const ch of [...guessed].filter(c => !currentWord.includes(c))) {
    const chip = document.createElement('div');
    chip.className = 'wrong-chip';
    chip.textContent = ch;
    el.appendChild(chip);
  }
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  for (const row of ROWS) {
    const rowEl = document.createElement('div');
    rowEl.className = 'key-row';
    for (const ch of row) {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.textContent = ch;
      btn.id = 'key-' + ch;
      if (guessed.has(ch)) {
        btn.disabled = true;
        btn.classList.add(currentWord.includes(ch) ? 'correct' : 'wrong');
      }
      btn.addEventListener('click', () => guess(ch));
      rowEl.appendChild(btn);
    }
    kb.appendChild(rowEl);
  }
}

function playKeySound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.connect(g); g.connect(actx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(580, t);
    osc.frequency.exponentialRampToValueAtTime(320, t + 0.055);
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
    osc.start(t); osc.stop(t + 0.07);
  } catch(e) {}
}

function guess(ch) {
  if (gameOver || guessed.has(ch)) return;
  playKeySound();
  guessed.add(ch);

  const btn = document.getElementById('key-' + ch);
  btn.disabled = true;

  if (currentWord.includes(ch)) {
    btn.classList.add('correct');
    // reveal letters with pop animation
    revealLetters(ch);
    // correct glow
    document.getElementById('word-display').classList.add('correct-glow');
    setTimeout(() => document.getElementById('word-display').classList.remove('correct-glow'), 600);

    // show face features progressively
    const revealed = [...currentWord].filter(c => guessed.has(c)).length;
    const pct = revealed / currentWord.length;
    if (pct >= 0.2) showFaceFeatures();

    // check win
    if ([...currentWord].every(c => guessed.has(c))) {
      endGame(true);
    }
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    showBodyPart(wrongCount - 1);
    renderHearts();
    renderWrong();

    // shake gallows
    const ga = document.getElementById('gallows-area');
    ga.classList.remove('shake');
    void ga.offsetWidth;
    ga.classList.add('shake');
    setTimeout(() => ga.classList.remove('shake'), 400);

    if (wrongCount >= MAX_WRONG) {
      endGame(false);
    }
  }
}

function revealLetters(ch) {
  const slots = document.querySelectorAll('#word-display .letter-slot');
  [...currentWord].forEach((c, i) => {
    if (c === ch) {
      const charEl = slots[i].querySelector('.letter-char');
      charEl.textContent = c;
      charEl.classList.add('revealed');
    }
  });
}

function showBodyPart(index) {
  const id = BODY_PARTS[index];
  const el = document.getElementById(id);
  el.classList.add('shown');

  // on head reveal, also show face
  if (id === 'bp-head') {
    setTimeout(() => {
      document.getElementById('eye-left').classList.add('shown');
      document.getElementById('eye-right').classList.add('shown');
      document.getElementById('mouth').classList.add('shown');
      document.getElementById('blush-l').classList.add('shown');
      document.getElementById('blush-r').classList.add('shown');
    }, 300);
  }
}

function showFaceFeatures() {
  document.getElementById('eye-left').classList.add('shown');
  document.getElementById('eye-right').classList.add('shown');
  document.getElementById('mouth').classList.add('shown');
  document.getElementById('blush-l').classList.add('shown');
  document.getElementById('blush-r').classList.add('shown');
}

function endGame(won) {
  gameOver = true;
  const correctPositions = [...currentWord].filter(ch => guessed.has(ch)).length;
  const hangmanScore = won ? (MAX_WRONG - wrongCount) * 110 + currentWord.length * 23 : correctPositions * 10;
  saveToLeaderboard('hangman', hangmanScore);
  document.getElementById('msg-score').textContent = `Score: ${hangmanScore}`;
  const overlay = document.getElementById('msg-overlay');
  const emoji = document.getElementById('msg-emoji');
  const title = document.getElementById('msg-title');
  const wordEl = document.getElementById('msg-word');

  if (won) {
    playWinSound();
    overlay.classList.add('visible', 'win');
    emoji.textContent = ['🎉','🌟','🥳','✨','🎊'][Math.floor(Math.random()*5)];
    title.textContent = 'You Win!';
    wordEl.textContent = 'The word was: ' + currentWord;
    spawnConfetti();
  } else {
    playLoseSound();
    // reveal all letters
    [...currentWord].forEach(c => guessed.add(c));
    renderWord();
    // sad face
    document.getElementById('mouth').setAttribute('d','M122,71 H123 V66 H137 V71 H138');
    // X eyes
    document.getElementById('eye-left').classList.remove('shown');
    document.getElementById('eye-right').classList.remove('shown');
    document.getElementById('eye-left-x2').classList.add('shown');
    document.getElementById('eye-right-x2').classList.add('shown');

    setTimeout(() => {
      overlay.classList.add('visible', 'lose');
      emoji.textContent = '😢';
      title.textContent = 'Game Over!';
      wordEl.textContent = 'The word was: ' + currentWord;
    }, 600);
  }
}

function spawnConfetti() {
  const colors = ['#f472b6','#a78bfa','#fbbf24','#34d399','#60a5fa','#f87171'];
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width = (8 + Math.random() * 8) + 'px';
      el.style.height = (8 + Math.random() * 8) + 'px';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 30);
  }
}

// Keyboard support
document.addEventListener('keydown', e => {
  const ch = e.key.toUpperCase();
  if (/^[A-Z]$/.test(ch) && !gameOver) guess(ch);
});

newGame();

function playWinSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.08);
      g.gain.setValueAtTime(0.12, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.12);
      osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.14);
    });
  } catch(e) {}
}

function playLoseSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [392, 311, 196].forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.13);
      g.gain.setValueAtTime(0.12, t + i * 0.13);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.13 + 0.16);
      osc.start(t + i * 0.13); osc.stop(t + i * 0.13 + 0.18);
    });
  } catch(e) {}
}

function playAgainSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctx.currentTime;
  [523, 659, 784].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t + i * 0.07);
    gain.gain.setValueAtTime(0.13, t + i * 0.07);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.1);
    osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.12);
  });
}
function playExitSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    [660, 330].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.12);
      g.gain.setValueAtTime(0.0, t + i * 0.12);
      g.gain.linearRampToValueAtTime(0.1, t + i * 0.12 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.14);
      osc.start(t + i * 0.12);
      osc.stop(t + i * 0.12 + 0.16);
    });
  } catch(e) {}
}
