    font-size: 0.45rem;

    border-radius: 2px;

  .board-wrap {
    position: relative;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    box-shadow: var(--glow-lavender), 0 20px 50px rgba(0,0,0,0.5);
  }
  .grid-bg {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    grid-template-rows: repeat(4, 100px);
    gap: 10px;
  }
  .cell-bg { background: rgba(255,255,255,0.03); border-radius: 4px; }
  .tiles-layer {
    position: absolute; inset: 10px;
    display: grid;
    grid-template-columns: repeat(4, 100px);
    grid-template-rows: repeat(4, 100px);
    gap: 10px;
    pointer-events: none;
  }
  .tile {
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    position: absolute; width: 100px; height: 100px;
    transition: left 0.14s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                top  0.14s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  @keyframes tile-new   { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
  .tile-new { animation: tile-new 0.18s cubic-bezier(.34,1.56,.64,1) both; }
  .tile.merged { animation: tile-merge 0.22s cubic-bezier(.34,1.56,.64,1); }
  @keyframes tile-merge { 0%{transform:scale(1)} 45%{transform:scale(1.22)} 100%{transform:scale(1)} }

  /* Tile colors — lower tiles keep original warm palette, higher go theme */
  .t-2    { background:#fef3c7; color:#92400e; font-size:2.2rem; }
  .t-4    { background:#fde68a; color:#78350f; font-size:2.2rem; }
  .t-8    { background:#fbbf24; color:#fff;    font-size:2.2rem; }
  .t-16   { background:#f97316; color:#fff;    font-size:2rem; }
  .t-32   { background:#ef4444; color:#fff;    font-size:2rem; }
  .t-64   { background:#dc2626; color:#fff;    font-size:2rem; box-shadow:0 0 20px rgba(220,38,38,0.5); }
  .t-128  { background:#c0a0e0; color:#0e0912; font-size:1.7rem; box-shadow:0 0 24px rgba(192,160,224,0.5); }
  .t-256  { background:#a878c8; color:#fff;    font-size:1.7rem; box-shadow:0 0 24px rgba(168,120,200,0.5); }
  .t-512  { background:#e070a8; color:#fff;    font-size:1.7rem; box-shadow:0 0 24px rgba(224,112,168,0.5); }
  .t-1024 { background:#d490b8; color:#fff;    font-size:1.4rem; box-shadow:0 0 28px rgba(212,144,184,0.6); }
  .t-2048 { background:linear-gradient(135deg,var(--pink-light),var(--lavender),var(--mint)); color:#0e0912; font-size:1.4rem; box-shadow:0 0 40px rgba(224,112,168,0.7); }
  .t-high { background:linear-gradient(135deg,var(--mint),var(--lavender)); color:#fff; font-size:1.2rem; }

  #overlay {
    position: fixed; inset: 0;

  .ov-title {

    animation: blink 1.6s ease-in-out infinite;

  .hint { font-family: var(--font-pixel); font-size: 0.38rem; color: var(--text-muted); margin-top: -4px; }

  </div>

<script>
const overlay = document.getElementById('overlay');
const tilesLayer = document.getElementById('tiles-layer');

const SIZE = 4, GAP = 10, CELL = 100;
const SLIDE_MS = 140; // must match CSS transition duration

let tiles = [], nextId = 0;
let score = 0, best = 0, state = 'idle', won = false, moving = false;

const bg = document.getElementById('grid-bg');
for (let i = 0; i < 16; i++) {
  const d = document.createElement('div'); d.className = 'cell-bg'; bg.appendChild(d);
}

function cellPos(r, c) { return { left: c * (CELL + GAP), top: r * (CELL + GAP) }; }
function tileClass(v)  { return v <= 2048 ? `t-${v}` : 't-high'; }

function makeTile(v, r, c, isNew) {
  const tile = { id: nextId++, v, r, c };
  const el = document.createElement('div');
  const p = cellPos(r, c);
  el.style.left = p.left + 'px';
  el.style.top  = p.top  + 'px';
  el.className  = `tile ${tileClass(v)}${isNew ? ' tile-new' : ''}`;
  el.textContent = v;
  tilesLayer.appendChild(el);
  tile.el = el;
  tiles.push(tile);
  return tile;
}

function getBoardArr() {
  const b = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  tiles.forEach(t => b[t.r][t.c] = t.v);
  return b;
}

function addRandomTile(animate) {
  const b = getBoardArr(), empty = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!b[r][c]) empty.push([r,c]);
  if (!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random() * empty.length)];
  makeTile(Math.random() < 0.85 ? 2 : 4, r, c, animate);
}

function newGame() {
  tiles.forEach(t => t.el.remove());
  tiles = []; score = 0; won = false; moving = false;
  document.getElementById('score').textContent = 0;
  addRandomTile(true); addRandomTile(true);
  overlay.classList.add('hidden');
  state = 'playing';
}

// Slide a line of tiles toward index 0 (caller reverses for right/down).
// Mutates tile.r / tile.c; returns array of merge records.
function processLine(line, getPos, setPos, isReverse) {
  const sorted = [...line].sort((a, b) => isReverse ? getPos(b) - getPos(a) : getPos(a) - getPos(b));
  let dest = isReverse ? SIZE - 1 : 0;
  const step = isReverse ? -1 : 1;
  let lastTile = null, lastV = null, lastDest = null, canMerge = true;
  const merges = [];
  for (const t of sorted) {
    if (canMerge && lastTile && t.v === lastV) {
      setPos(t, lastDest);
      merges.push({ from: t, into: lastTile, newV: t.v * 2 });
      canMerge = false; lastTile = null; lastV = null;
    } else {
      setPos(t, dest);
      lastDest = dest; lastV = t.v; lastTile = t;
      dest += step; canMerge = true;
    }
  }
  return merges;
}

function move(dir) {
  if (state !== 'playing' || moving) return;

  const before = tiles.map(t => ({ id: t.id, r: t.r, c: t.c }));
  const merges = [];

  if (dir === 'left' || dir === 'right') {
    const rev = dir === 'right';
    for (let r = 0; r < SIZE; r++)
      merges.push(...processLine(tiles.filter(t => t.r === r), t => t.c, (t,v) => t.c = v, rev));
  } else {
    const rev = dir === 'down';
    for (let c = 0; c < SIZE; c++)
      merges.push(...processLine(tiles.filter(t => t.c === c), t => t.r, (t,v) => t.r = v, rev));
  }

  const changed = before.some(b => { const t = tiles.find(x => x.id === b.id); return t && (t.r !== b.r || t.c !== b.c); });
  if (!changed && !merges.length) return;
  playSlide();

  score += merges.reduce((s, m) => s + m.newV, 0);
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; document.getElementById('best').textContent = best; }

  // Update DOM positions → CSS transitions fire
  tiles.forEach(t => {
    const p = cellPos(t.r, t.c);
    t.el.style.left = p.left + 'px';
    t.el.style.top  = p.top  + 'px';
  });
  // Merging tiles slide on top so they're visible during the slide
  merges.forEach(m => { m.from.el.style.zIndex = 5; });

  moving = true;

  setTimeout(() => {
    if (merges.length) playMerge(Math.max(...merges.map(m => m.newV)));
    merges.forEach(({ from, into, newV }) => {
      from.el.remove();
      tiles = tiles.filter(t => t !== from);
      into.v = newV;
      into.el.className = `tile ${tileClass(newV)} merged`;
      into.el.textContent = newV;
      into.el.style.zIndex = '';
      setTimeout(() => into.el.classList.remove('merged'), 250);
    });

    addRandomTile(true);
    moving = false;

    if (!won && tiles.some(t => t.v === 2048)) {
      won = true;
      setTimeout(playWinSound, 300);
      setTimeout(() => showOverlay('🎉', 'You reached 2048!', 'Keep going for a higher score!'), 300);
      return;
    }
    if (!canMove()) {
      state = 'dead';
      setTimeout(playLoseSound, 300);
      setTimeout(() => showOverlay('😢', 'Game Over', `Final score: ${score}`), 300);
    }
  }, SLIDE_MS + 20);
}

function canMove() {
  const b = getBoardArr();
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (!b[r][c]) return true;
    if (c < SIZE-1 && b[r][c] === b[r][c+1]) return true;
    if (r < SIZE-1 && b[r][c] === b[r+1][c]) return true;
  }
  return false;
}

function showOverlay(emoji, title, sub) {
  saveToLeaderboard('2048', score);
  document.getElementById('ov-emoji').textContent = emoji;
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-sub').textContent   = sub;
  document.getElementById('ov-prompt').textContent = '';
  document.getElementById('ov-buttons').style.display = 'flex';
  overlay.classList.remove('hidden');
}

document.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.key]) {
    e.preventDefault();
    if (state === 'idle') { overlay.classList.add('hidden'); document.getElementById('ov-buttons').style.display='none'; state='playing'; newGame(); return; }
    move(map[e.key]);
  }
  if (e.key === 'n' || e.key === 'N') newGame();
});

let tx0, ty0;
document.addEventListener('touchstart', e => { tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if (Math.max(Math.abs(dx),Math.abs(dy))<30) return;
  if (Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
}, {passive:true});

function playSlide() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(130, t + 0.06);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    osc.start(t); osc.stop(t + 0.09);
  } catch(e) {}
}

function playMerge(value) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    const freq = 200 * Math.pow(1.14, Math.log2(value));
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.6, t + 0.05);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.start(t); osc.stop(t + 0.12);
  } catch(e) {}
}

function playWinSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.08);
      g.gain.setValueAtTime(0.12, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.12);
      osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.14);
    });
  } catch(e) {}
}

function playLoseSound() {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [392, 311, 196].forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.13);
      g.gain.setValueAtTime(0.12, t + i * 0.13);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.13 + 0.16);
      osc.start(t + i * 0.13); osc.stop(t + i * 0.13 + 0.18);
    });
  } catch(e) {}
}

function playAgainSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const t = ctx.currentTime;
  [523, 659, 784].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t + i * 0.07);
    gain.gain.setValueAtTime(0.13, t + i * 0.07);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.1);
    osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.12);
  });
}
function playExitSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    [660, 330].forEach((freq, i) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + i * 0.12);
      g.gain.setValueAtTime(0.0, t + i * 0.12);
      g.gain.linearRampToValueAtTime(0.1, t + i * 0.12 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.14);
      osc.start(t + i * 0.12);
      osc.stop(t + i * 0.12 + 0.16);
    });
  } catch(e) {}
}
</script>

<button id="theme-toggle" onclick="toggleTheme()"></button>
<script>
const MOON_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-toggle').innerHTML = isLight ? MOON_SVG : '☼';
}
if (localStorage.getItem('theme') === 'light') {
  document.body.classList.add('light-mode');
}
document.getElementById('theme-toggle').innerHTML =
  document.body.classList.contains('light-mode') ? MOON_SVG : '☼';
function saveToLeaderboard(game, score) {
  if (!_arcadeUser) { console.warn('[Leaderboard] not logged in — score not saved'); return; }
  db.collection('leaderboard').add({ name: _arcadeUser.displayName, game, score, date: new Date().toISOString() })
    .then(() => console.log('[Leaderboard] saved:', game, score))
    .catch(e => console.error('[Leaderboard] write failed:', e));
}
</script>
